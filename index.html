<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éclipse — Virtual Fitting Studio</title>
<style>
:root{--b:#000;--w:#fff;--g:#b8b8b8;--line:#262626;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--w);font-family:var(--sans);height:100%;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:64px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);z-index:5}
.logo{font:italic 700 27px var(--serif);letter-spacing:-1px}.meta{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#aaa}
main{display:grid;grid-template-columns:250px 1fr 300px;min-height:0}
.panel{border-right:1px solid var(--line);padding:22px;overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}
.eyebrow{font-size:9px;letter-spacing:.2em;color:#888;text-transform:uppercase;margin-bottom:12px}.title{font:500 30px var(--serif);line-height:1.05;margin:0 0 24px}
.section{padding:18px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}
label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{border:1px solid #333;background:#080808;color:#fff;padding:11px 8px;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.choice.active{background:#fff;color:#000;border-color:#fff}
.text-input{width:100%;background:#050505;border:1px solid #333;color:#fff;padding:10px;font-size:11px;outline:none}.text-input:focus{border-color:#fff}.color-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.color-row input{width:46px;height:28px;border:1px solid #333;background:#000;padding:0}.remove-cloth{float:right;border:0;background:none;color:#777;font-size:12px}.remove-cloth:hover{color:#fff}
.slider{width:100%;accent-color:#fff}.value{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:5px}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 42%,#252525 0,#0d0d0d 33%,#000 70%);overflow:hidden}
#canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:22px;bottom:20px;font-size:10px;color:#777;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.toolbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;border:1px solid #333;background:#050505}.tool{padding:9px 13px;color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.1em;border-right:1px solid #333}.tool:last-child{border:0}.tool.active{color:#000;background:#fff}
.garment-card{border:1px solid #292929;padding:13px;margin-bottom:8px;background:#050505}.garment-card.active{border-color:#fff}.garment-card button:first-child{width:100%;background:none;color:#fff;border:0;text-align:left}.garment-name{font:20px var(--serif)}.garment-sub{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.action{width:100%;border:1px solid #fff;background:#fff;color:#000;padding:12px;text-transform:uppercase;font-size:10px;letter-spacing:.14em;margin-top:10px}.secondary{background:#000;color:#fff;border-color:#333}
.badge{display:inline-block;border:1px solid #333;padding:5px 7px;font-size:9px;color:#aaa;margin-top:8px}
@media(max-width:900px){html,body{overflow:hidden}.app{grid-template-rows:54px 1fr}main{display:block;position:relative}.stage{height:calc(100dvh - 54px);width:100%}header{height:54px;padding:0 14px}.logo{font-size:22px}.meta{display:none}.panel{display:none}.panel.mobile-open{display:block;position:fixed;z-index:30;left:10px;right:10px;top:64px;bottom:72px;background:#050505;border:1px solid #333;padding:16px;overflow-y:auto;border-radius:10px;box-shadow:0 20px 60px #000}.right.mobile-open{display:block}.toolbar{top:10px;max-width:calc(100% - 24px);overflow:hidden}.tool{padding:8px 9px;font-size:9px}.hint{display:none}.mobilebar{display:flex!important;bottom:10px;left:10px;right:10px;border-radius:9px}.mobilebar button{min-height:42px}.stage #canvas{touch-action:none}}
.mobilebar{display:none;position:absolute;bottom:12px;left:10px;right:10px;z-index:40;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);border:1px solid #333;padding:7px;gap:6px}.mobilebar button{flex:1;padding:10px 6px;background:#111;color:#fff;border:1px solid #333;font-size:9px;text-transform:uppercase;letter-spacing:.06em;border-radius:5px}.mobilebar button:active{background:#fff;color:#000}
.close-panel{display:none}
@media(max-width:900px){.close-panel{display:block;position:absolute;right:12px;top:10px;width:30px;height:30px;border:1px solid #333;background:#111;color:#fff;border-radius:50%;font-size:18px;line-height:26px}.panel.mobile-open{padding-top:48px}.toolbar{left:12px;right:12px;transform:none;justify-content:center}.tool{flex:1;text-align:center}.stage:after{content:'SWIPE TO ROTATE';position:absolute;bottom:67px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.18em;color:#666;pointer-events:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Éclipse</div><div class="meta">Physical fitting studio / 360°</div><div class="meta" id="lookMeta">LOOK 01 · NOIR</div></header>
<main>
<aside class="panel"><button class="close-panel" data-close="avatar">×</button>
<div class="eyebrow">Virtual body</div><h1 class="title">The physical<br>model.</h1>
<div class="section"><label>Avatar</label><div class="grid"><button class="choice active" data-gender="girl">Girl</button><button class="choice" data-gender="boy">Boy</button></div></div>
<div class="section"><label>Model proportion</label><div class="grid"><button class="choice active" data-body="standard">Standard</button><button class="choice" data-body="tall">Tall</button></div></div>
<div class="section"><label>Fit</label><input class="slider" id="fit" type="range" min="-12" max="18" value="0"><div class="value"><span>SLIM</span><span id="fitVal">REGULAR</span><span>LOOSE</span></div></div>
<div class="section"><label>Turntable</label><div class="grid"><button class="choice active" id="auto">Auto</button><button class="choice" id="reset">Reset</button></div><span class="badge">Drag to rotate · wheel to zoom</span></div>
</aside>
<section class="stage"><canvas id="canvas"></canvas><div class="toolbar"><button class="tool active" id="front">Front</button><button class="tool" id="back">Back</button><button class="tool" id="side">Side</button><button class="tool" id="full">360°</button></div><div class="hint">Drag the model · scroll to zoom · change garments at right</div><div class="mobilebar"><button id="mAvatar">Avatar</button><button id="mFit">Wardrobe</button><button id="mRotate">360°</button><button id="mReset">Reset</button></div></section>
<aside class="panel right"><button class="close-panel" data-close="wardrobe">×</button><div class="eyebrow">Wardrobe</div><h2 class="title">Change<br>the cloth.</h2><div id="wardrobe"></div>
<div class="section"><label>Add your own cloth</label><input id="clothName" class="text-input" placeholder="Cloth name" maxlength="28"><input id="clothImage" class="text-input" type="file" accept="image/png,image/jpeg,image/webp" style="margin-top:8px"><div class="grid" style="margin-top:8px"><button class="choice active" data-custom-type="shirt">Top</button><button class="choice" data-custom-type="dress">Dress</button><button class="choice" data-custom-type="jacket">Jacket</button><button class="choice" data-custom-type="trouser">Trousers</button></div><div class="color-row"><label style="margin:0">Color</label><input id="clothColor" type="color" value="#ffffff"></div><button class="action" id="addCloth">Add cloth to wardrobe</button></div>
<div class="section"><label>Garment fit</label><input class="slider" id="garFit" type="range" min="-10" max="22" value="0"><div class="value"><span>BODY</span><span id="garFitVal">0</span><span>OVERSIZED</span></div><button class="action" id="save">Save look</button><button class="action secondary" id="photo">Snapshot</button></div></aside>
</main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"}}</script>
<script type="module">

const model=new THREE.Group();scene.add(model);const textureLoader=new THREE.TextureLoader();const matBody=new THREE.MeshStandardMaterial({color:0xd9d2cb,roughness:.72});const matSkin=new THREE.MeshStandardMaterial({color:0xe7b99e,roughness:.8});const matHair=new THREE.MeshStandardMaterial({color:0x171717,roughness:.95});const body=new THREE.Group();model.add(body);let gender="girl",bodyScale=1,fit=0,current="atelier shirt";const clothes=new THREE.Group();model.add(clothes);let customGarments=JSON.parse(localStorage.getItem("eclipse-custom-garments")||"[]");

function rebuildHuman(){
while(body.children.length)body.remove(body.children[0]);
const female=gender==="girl";
const shoulder=female?.43:.49, waist=female?.33:.39, hip=female?.49:.42;
const skin=new THREE.MeshStandardMaterial({color:0xe2aa8d,roughness:.72,metalness:0});
const skinDark=new THREE.MeshStandardMaterial({color:0xb8795e,roughness:.8});
const eyeWhite=new THREE.MeshStandardMaterial({color:0xf4f4f4,roughness:.45});

const neck=cyl(.105,.135,.2,skin);neck.position.y=2.23;body.add(neck);
const head=sphere(female?.255:.275,female?.315:.335,female?.255:.275,skin);head.position.set(0,2.56,.015);body.add(head);

// ears

// eyes + brows

// mouth
const mouth=new THREE.Mesh(new THREE.BoxGeometry(.075,.018,.012),lip);mouth.position.set(0,2.465,.26);body.add(mouth);

const hairMat=new THREE.MeshStandardMaterial({color:0x171717,roughness:.95});
const hair=sphere(female?.285:.30,female?.16:.18,female?.28:.30,hairMat);hair.position.set(0,2.78,-.015);body.add(hair);
const backHair=sphere(female?.29:.305,female?.22:.20,female?.13:.16,hairMat);backHair.position.set(0,2.63,-.17);body.add(backHair);
if(female){
 const pony=sphere(.12,.24,.12,hairMat);pony.position.set(-.27,2.62,-.08);body.add(pony);

}

// arms with shoulders, forearms and hands
const armR=female?.085:.105, handR=female?.085:.095;
for(const side of[-1,1]){
 const shoulderJoint=sphere(armR*1.25,armR*1.25,armR*1.25,skin);shoulderJoint.position.set(side*shoulder,2.02,0);body.add(shoulderJoint);

 body.add(limb(new THREE.Vector3(side*(shoulder+.16),1.48,0),new THREE.Vector3(side*(shoulder+.18),.96,0),armR*.88,skin));
 const hand=sphere(handR*.72,handR*1.35,handR*.55,skin);hand.position.set(side*(shoulder+.18),.86,0);body.add(hand);
}

// legs + feet
const legR=female?.135:.16;
for(const side of[-1,1]){
 const x=side*(female?.17:.19);
 body.add(limb(new THREE.Vector3(x,.58,0),new THREE.Vector3(x,-.34,0),legR,skin));
 const foot=sphere(.16,.08,.29,skin);foot.position.set(x,-.43,.08);body.add(foot);
}

}
function garmentMat(color,textureUrl){const m=new THREE.MeshStandardMaterial({color:new THREE.Color(color||0xffffff),roughness:.9,side:THREE.DoubleSide});if(textureUrl){const t=textureLoader.load(textureUrl);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;m.map=t;m.color.set(0xffffff);m.needsUpdate=true}return m}
const garments={"atelier shirt":{type:"shirt",desc:"structured cotton",color:"#ffffff"},"noir jacket":{type:"jacket",desc:"tailored wool",color:"#ffffff"},"column dress":{type:"dress",desc:"long silhouette",color:"#ffffff"},"wide trousers":{type:"trouser",desc:"fluid cut",color:"#ffffff"}};
function clear(g){while(g.children.length)g.remove(g.children[0])}
function makeGarment(){clear(clothes);const item=garments[current]||customGarments.find(x=>x.name===current);if(!item)return;const f=fit/100,mat=garmentMat(item.color,item.texture),female=gender==="girl";if(item.type==="shirt"||item.type==="jacket"){const g=cyl((female?.45:.48)+f,(female?.52:.57)+f,1.02,mat);g.position.y=1.55;clothes.add(g);for(const x of[-(female?.62:.66),female?.62:.66]){const s=cyl(.13+f/4,.11+f/4,.63,mat);s.position.set(x,1.72,0);clothes.add(s)}}if(item.type==="jacket"){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.06,.7,.04),mat);stripe.position.set(-.16,1.72,.56);stripe.rotation.z=-.18;clothes.add(stripe);const stripe2=stripe.clone();stripe2.position.x=.16;stripe2.rotation.z=.18;clothes.add(stripe2)}if(item.type==="dress"){const g=cyl((female?.37:.40)+f,(female?.60:.63)+f,1.72,mat);g.position.y=1.25;clothes.add(g);const strap1=cyl(.035,.035,.35,mat);strap1.position.set(-.2,2.04,0);clothes.add(strap1);const strap2=strap1.clone();strap2.position.x=.2;clothes.add(strap2)}if(item.type==="trouser"){for(const x of[-(female?.32:.35),female?.32:.35]){const p=cyl(.22+f,.29+f,1.02,mat);p.position.set(x,.03,0);clothes.add(p)}}clothes.scale.set(1,bodyScale,1);updateMeta()}

document.querySelectorAll("[data-gender]").forEach(b=>b.onclick=()=>setGender(b.dataset.gender));let customType="shirt";document.querySelectorAll("[data-custom-type]").forEach(b=>b.onclick=()=>{customType=b.dataset.customType;document.querySelectorAll("[data-custom-type]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});document.querySelector("#addCloth").onclick=async()=>{const name=document.querySelector("#clothName").value.trim()||`Custom ${customType}`;const color=document.querySelector("#clothColor").value;const file=document.querySelector("#clothImage").files[0];let texture="";if(file){if(file.size>1200000){alert("Please use an image under 1.2MB.");return}texture=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}customGarments=customGarments.filter(x=>x.name!==name);customGarments.push({name,type:customType,color,texture,desc:texture?"your design · textured":"your custom cloth"});try{localStorage.setItem("eclipse-custom-garments",JSON.stringify(customGarments))}catch(e){alert("That design is too large for browser storage. Try a smaller image.");return}current=name;document.querySelector("#clothName").value="";document.querySelector("#clothImage").value="";addWardrobe();makeGarment()};addWardrobe();rebuildHuman();makeGarment();
document.querySelectorAll("[data-body]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-body]").forEach(x=>x.classList.remove("active"));b.classList.add("active");bodyScale=b.dataset.body==="tall"?1.06:1;rebuildHuman();makeGarment()});document.querySelector("#fit").oninput=e=>setFit(e.target.value);document.querySelector("#garFit").oninput=e=>setFit(e.target.value);
