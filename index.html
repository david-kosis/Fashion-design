<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éclipse — Virtual Fitting Studio</title>
<style>
:root{--b:#000;--w:#fff;--g:#b8b8b8;--line:#262626;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--w);font-family:var(--sans);height:100%;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:64px 1fr}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);z-index:5}
.logo{font:italic 700 27px var(--serif);letter-spacing:-1px}.meta{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#aaa}
main{display:grid;grid-template-columns:250px 1fr 300px;min-height:0}
.panel{border-right:1px solid var(--line);padding:22px;overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}
.eyebrow{font-size:9px;letter-spacing:.2em;color:#888;text-transform:uppercase;margin-bottom:12px}.title{font:500 30px var(--serif);line-height:1.05;margin:0 0 24px}
.section{padding:18px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}
label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{border:1px solid #333;background:#080808;color:#fff;padding:11px 8px;text-transform:uppercase;font-size:10px;letter-spacing:.08em}.choice.active{background:#fff;color:#000;border-color:#fff}
.text-input{width:100%;background:#050505;border:1px solid #333;color:#fff;padding:10px;font-size:11px;outline:none}.text-input:focus{border-color:#fff}.color-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.color-row input{width:46px;height:28px;border:1px solid #333;background:#000;padding:0}.remove-cloth{float:right;border:0;background:none;color:#777;font-size:12px}.remove-cloth:hover{color:#fff}
.slider{width:100%;accent-color:#fff}.value{display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-top:5px}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 42%,#252525 0,#0d0d0d 33%,#000 70%);overflow:hidden}
#canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:22px;bottom:20px;font-size:10px;color:#777;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
.toolbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;border:1px solid #333;background:#050505}.tool{padding:9px 13px;color:#aaa;font-size:10px;text-transform:uppercase;letter-spacing:.1em;border-right:1px solid #333}.tool:last-child{border:0}.tool.active{color:#000;background:#fff}
.garment-card{border:1px solid #292929;padding:13px;margin-bottom:8px;background:#050505}.garment-card.active{border-color:#fff}.garment-card button:first-child{width:100%;background:none;color:#fff;border:0;text-align:left}.garment-name{font:20px var(--serif)}.garment-sub{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.action{width:100%;border:1px solid #fff;background:#fff;color:#000;padding:12px;text-transform:uppercase;font-size:10px;letter-spacing:.14em;margin-top:10px}.secondary{background:#000;color:#fff;border-color:#333}
.badge{display:inline-block;border:1px solid #333;padding:5px 7px;font-size:9px;color:#aaa;margin-top:8px}
@media(max-width:900px){.app{grid-template-rows:56px 1fr}main{grid-template-columns:1fr}.panel{display:none}.stage{height:calc(100dvh - 56px)}header{padding:0 16px}.meta{display:none}.mobilebar{display:flex!important}}
.mobilebar{display:none;position:absolute;bottom:12px;left:12px;right:12px;z-index:4;background:#050505;border:1px solid #333;padding:8px;gap:7px}.mobilebar button{flex:1;padding:10px;background:#111;color:#fff;border:1px solid #333;font-size:9px;text-transform:uppercase}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Éclipse</div><div class="meta">Physical fitting studio / 360°</div><div class="meta" id="lookMeta">LOOK 01 · NOIR</div></header>
<main>
<aside class="panel">
<div class="eyebrow">Virtual body</div><h1 class="title">The physical<br>model.</h1>
<div class="section"><label>Avatar</label><div class="grid"><button class="choice active" data-gender="girl">Girl</button><button class="choice" data-gender="boy">Boy</button></div></div>
<div class="section"><label>Model proportion</label><div class="grid"><button class="choice active" data-body="standard">Standard</button><button class="choice" data-body="tall">Tall</button></div></div>
<div class="section"><label>Fit</label><input class="slider" id="fit" type="range" min="-12" max="18" value="0"><div class="value"><span>SLIM</span><span id="fitVal">REGULAR</span><span>LOOSE</span></div></div>
<div class="section"><label>Turntable</label><div class="grid"><button class="choice active" id="auto">Auto</button><button class="choice" id="reset">Reset</button></div><span class="badge">Drag to rotate · wheel to zoom</span></div>
</aside>
<section class="stage"><canvas id="canvas"></canvas><div class="toolbar"><button class="tool active" id="front">Front</button><button class="tool" id="back">Back</button><button class="tool" id="side">Side</button><button class="tool" id="full">360°</button></div><div class="hint">Drag the model · scroll to zoom · change garments at right</div><div class="mobilebar"><button id="mFit">Fit</button><button id="mRotate">360°</button><button id="mReset">Reset</button></div></section>
<aside class="panel right"><div class="eyebrow">Wardrobe</div><h2 class="title">Change<br>the cloth.</h2><div id="wardrobe"></div>
<div class="section"><label>Add your own cloth</label><input id="clothName" class="text-input" placeholder="Cloth name" maxlength="28"><div class="grid" style="margin-top:8px"><button class="choice active" data-custom-type="shirt">Top</button><button class="choice" data-custom-type="dress">Dress</button><button class="choice" data-custom-type="jacket">Jacket</button><button class="choice" data-custom-type="trouser">Trousers</button></div><div class="color-row"><label style="margin:0">Color</label><input id="clothColor" type="color" value="#ffffff"></div><button class="action" id="addCloth">Add cloth to wardrobe</button></div>
<div class="section"><label>Garment fit</label><input class="slider" id="garFit" type="range" min="-10" max="22" value="0"><div class="value"><span>BODY</span><span id="garFitVal">0</span><span>OVERSIZED</span></div><button class="action" id="save">Save look</button><button class="action secondary" id="photo">Snapshot</button></div></aside>
</main></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";
const canvas=document.querySelector("#canvas");const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(30,1,.1,100);camera.position.set(0,1.5,5.2);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=3.1;controls.maxDistance=7;controls.target.set(0,1.55,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x111111,2.2));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(3,5,4);scene.add(key);const rim=new THREE.DirectionalLight(0xffffff,2);rim.position.set(-3,3,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.7,64),new THREE.MeshStandardMaterial({color:0x090909,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=.02;scene.add(floor);
const model=new THREE.Group();scene.add(model);const matBody=new THREE.MeshStandardMaterial({color:0xd9d2cb,roughness:.72});const matSkin=new THREE.MeshStandardMaterial({color:0xe7b99e,roughness:.8});const matHair=new THREE.MeshStandardMaterial({color:0x171717,roughness:.95});const body=new THREE.Group();model.add(body);let gender="girl",bodyScale=1,fit=0,current="atelier shirt";const clothes=new THREE.Group();model.add(clothes);let customGarments=JSON.parse(localStorage.getItem("eclipse-custom-garments")||"[]");
function cyl(r1,r2,h,mat){return new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,32))}function sphere(sx,sy,sz,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),mat);m.scale.set(sx,sy,sz);return m}function limb(a,b,r,mat){const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5),len=a.distanceTo(b),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,32),mat);m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3().subVectors(b,a).normalize());return m}
function rebuildHuman(){while(body.children.length)body.remove(body.children[0]);const female=gender==="girl",shoulder=female?.43:.49,waist=female?.34:.39,hip=female?.47:.40;const torso=cyl(waist+.02,shoulder,1.15,matSkin);torso.position.y=1.56;body.add(torso);const pelvis=cyl(hip,waist+.03,.45,matSkin);pelvis.position.y=.72;body.add(pelvis);const neck=cyl(.13,.14,.18,matSkin);neck.position.y=2.25;body.add(neck);const head=sphere(female?.27:.29,female?.33:.35,female?.27:.29,matSkin);head.position.y=2.56;body.add(head);const eyeMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:1});for(const x of[-.095,.095]){const eye=sphere(.026,.026,.018,eyeMat);eye.position.set(x,2.59,.265);body.add(eye)}const hair=sphere(female?.285:.30,female?.14:.17,female?.28:.30,matHair);hair.position.set(0,2.78,-.015);body.add(hair);if(female){const pony=sphere(.13,.20,.13,matHair);pony.position.set(-.27,2.62,-.02);body.add(pony)}const armR=female?.095:.11,legR=female?.145:.16,shoulderY=2.02,elbowY=1.46,wristY=.92;for(const side of[-1,1]){body.add(limb(new THREE.Vector3(side*shoulder,shoulderY,0),new THREE.Vector3(side*(shoulder+.17),elbowY,0),armR,matSkin));body.add(limb(new THREE.Vector3(side*(shoulder+.17),elbowY,0),new THREE.Vector3(side*(shoulder+.18),wristY,0),armR*.88,matSkin))}for(const side of[-1,1]){const x=side*(female?.17:.19);body.add(limb(new THREE.Vector3(x,.53,0),new THREE.Vector3(x*(female?.2/.17:1),-.35,0),legR,matSkin))}body.scale.set(1,bodyScale,1)}
function garmentMat(color){return new THREE.MeshStandardMaterial({color:new THREE.Color(color||0xffffff),roughness:.9,side:THREE.DoubleSide})}
const garments={"atelier shirt":{type:"shirt",desc:"structured cotton",color:"#ffffff"},"noir jacket":{type:"jacket",desc:"tailored wool",color:"#ffffff"},"column dress":{type:"dress",desc:"long silhouette",color:"#ffffff"},"wide trousers":{type:"trouser",desc:"fluid cut",color:"#ffffff"}};
function clear(g){while(g.children.length)g.remove(g.children[0])}
function makeGarment(){clear(clothes);const item=garments[current]||customGarments.find(x=>x.name===current);if(!item)return;const f=fit/100,mat=garmentMat(item.color),female=gender==="girl";if(item.type==="shirt"||item.type==="jacket"){const g=cyl((female?.45:.48)+f,(female?.52:.57)+f,1.02,mat);g.position.y=1.55;clothes.add(g);for(const x of[-(female?.62:.66),female?.62:.66]){const s=cyl(.13+f/4,.11+f/4,.63,mat);s.position.set(x,1.72,0);clothes.add(s)}}if(item.type==="jacket"){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.06,.7,.04),mat);stripe.position.set(-.16,1.72,.56);stripe.rotation.z=-.18;clothes.add(stripe);const stripe2=stripe.clone();stripe2.position.x=.16;stripe2.rotation.z=.18;clothes.add(stripe2)}if(item.type==="dress"){const g=cyl((female?.37:.40)+f,(female?.60:.63)+f,1.72,mat);g.position.y=1.25;clothes.add(g);const strap1=cyl(.035,.035,.35,mat);strap1.position.set(-.2,2.04,0);clothes.add(strap1);const strap2=strap1.clone();strap2.position.x=.2;clothes.add(strap2)}if(item.type==="trouser"){for(const x of[-(female?.32:.35),female?.32:.35]){const p=cyl(.22+f,.29+f,1.02,mat);p.position.set(x,.03,0);clothes.add(p)}}clothes.scale.set(1,bodyScale,1);updateMeta()}
function updateMeta(){document.querySelector("#lookMeta").textContent="LOOK 01 · "+current.toUpperCase();document.querySelector("#garFitVal").textContent=fit>0?"+"+fit:fit;document.querySelector("#fitVal").textContent=fit<-4?"SLIM":fit>6?"LOOSE":"REGULAR"}
function setFit(v){fit=+v;document.querySelector("#fit").value=fit;document.querySelector("#garFit").value=fit;makeGarment()}function setGender(g){gender=g;document.querySelectorAll("[data-gender]").forEach(x=>x.classList.toggle("active",x.dataset.gender===g));rebuildHuman();makeGarment()}
function addWardrobe(){const box=document.querySelector("#wardrobe");box.innerHTML="";const all=[...Object.entries(garments).map(([name,g])=>[name,g]),...customGarments.map(g=>[g.name,g])];all.forEach(([name,g])=>{const d=document.createElement("div");d.className="garment-card"+(name===current?" active":"");d.innerHTML=`<button><div class="garment-name">${name}</div><div class="garment-sub">${g.desc||"custom garment"} · ${g.color||"#fff"}</div></button>${customGarments.some(x=>x.name===name)?'<button class="remove-cloth" title="Remove">×</button>':''}`;d.querySelector("button:first-child").onclick=()=>{current=name;addWardrobe();makeGarment()};const rm=d.querySelector(".remove-cloth");if(rm)rm.onclick=(e)=>{e.stopPropagation();customGarments=customGarments.filter(x=>x.name!==name);localStorage.setItem("eclipse-custom-garments",JSON.stringify(customGarments));if(current===name)current="atelier shirt";addWardrobe();makeGarment()};box.appendChild(d)})}
document.querySelectorAll("[data-gender]").forEach(b=>b.onclick=()=>setGender(b.dataset.gender));let customType="shirt";document.querySelectorAll("[data-custom-type]").forEach(b=>b.onclick=()=>{customType=b.dataset.customType;document.querySelectorAll("[data-custom-type]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});document.querySelector("#addCloth").onclick=()=>{const name=document.querySelector("#clothName").value.trim()||`Custom ${customType}`;const color=document.querySelector("#clothColor").value;customGarments=customGarments.filter(x=>x.name!==name);customGarments.push({name,type:customType,color,desc:"your custom cloth"});localStorage.setItem("eclipse-custom-garments",JSON.stringify(customGarments));current=name;document.querySelector("#clothName").value="";addWardrobe();makeGarment()};addWardrobe();rebuildHuman();makeGarment();
document.querySelectorAll("[data-body]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-body]").forEach(x=>x.classList.remove("active"));b.classList.add("active");bodyScale=b.dataset.body==="tall"?1.06:1;rebuildHuman();makeGarment()});document.querySelector("#fit").oninput=e=>setFit(e.target.value);document.querySelector("#garFit").oninput=e=>setFit(e.target.value);
let auto=true;document.querySelector("#auto").onclick=()=>{auto=!auto;document.querySelector("#auto").textContent=auto?"Auto":"Manual";document.querySelector("#auto").classList.toggle("active",auto)};document.querySelector("#reset").onclick=()=>{controls.reset();camera.position.set(0,1.5,5.2);controls.target.set(0,1.55,0);controls.update()};function angle(a){auto=false;document.querySelector("#auto").classList.remove("active");model.rotation.y=a}document.querySelector("#front").onclick=()=>angle(0);document.querySelector("#back").onclick=()=>angle(Math.PI);document.querySelector("#side").onclick=()=>angle(Math.PI/2);document.querySelector("#full").onclick=()=>{auto=true;document.querySelector("#auto").classList.add("active")};
document.querySelector("#save").onclick=()=>localStorage.setItem("eclipse-look",JSON.stringify({current,fit,bodyScale,gender}));document.querySelector("#photo").onclick=()=>{const a=document.createElement("a");a.download="eclipse-look.png";a.href=renderer.domElement.toDataURL("image/png");a.click()};document.querySelector("#mFit").onclick=()=>document.querySelector(".right").scrollIntoView({behavior:"smooth"});document.querySelector("#mRotate").onclick=()=>auto=true;document.querySelector("#mReset").onclick=()=>document.querySelector("#reset").click();
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}window.addEventListener("resize",resize);resize();function animate(){requestAnimationFrame(animate);if(auto)model.rotation.y+=.004;controls.update();renderer.render(scene,camera)}animate();
</script>
</body></html>
